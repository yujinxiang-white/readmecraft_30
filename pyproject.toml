[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readmecraft"
version = "0.1.0"
description = "给 README 打分的轻量检查器 / A zero-dependency README linter"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ReadmeCraft contributors" }]
keywords = ["readme", "linter", "documentation", "open-source"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
readmecraft = "readmecraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
